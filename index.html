<style>
/* Layout: one column. Top bar, central canvas, slide strip, context panel, bottom toolbar. */
:root{
  --bg:#121317; --panel:#1a1c21; --panel-2:#23262d; --panel-3:#2b2f38; --line:#2f333b;
  --ink:#eceef2; --mute:#8d93a0; --accent:#3b82f6; --accent-ink:#ffffff; --danger:#f0605d; --ok:#34c38f; --stage:#0b0c0f;
  --ui:system-ui,'Roboto','Segoe UI',sans-serif; --err-ink:#ffb4b2;
  color-scheme:dark;
}
:root[data-zt="light"]{--bg:#eceef3;--panel:#ffffff;--panel-2:#f0f2f6;--panel-3:#e2e6ee;--line:#d2d7e1;--ink:#161922;--mute:#626a7a;--stage:#d9dde6;--err-ink:#a3231f;color-scheme:light}
body,.top,#strip,#panel,#toolbar,#stage{transition:background-color .5s ease,border-color .5s ease}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* top bar */
.top{display:flex;align-items:center;gap:0;height:50px;padding:0 4px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ib{width:38px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.ib:active{background:var(--panel-3)}
.ib[disabled]{opacity:.3;pointer-events:none}
.title{flex:1;min-width:0;text-align:left;padding:2px 8px;display:flex;flex-direction:column;border-radius:8px}
.title b::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mute);opacity:.55}
.title.saved b::before{background:var(--ok);opacity:1}
.title b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:10px;letter-spacing:.08em;color:var(--mute);margin-right:4px}
.state.saved{color:var(--ok)}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:0 13px;height:36px;font-weight:600;display:flex;align-items:center;gap:5px;flex:none;margin-left:4px}
.pill:active{filter:brightness(.9)}

/* stage */
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:var(--stage);touch-action:none;overflow:hidden}
#canvasWrap{position:relative;box-shadow:0 0 0 1px #000,0 10px 32px rgba(0,0,0,.55);background:repeating-conic-gradient(#c3c7cf 0 25%,#eef0f4 0 50%) 0 0/24px 24px}
#cv{display:block;touch-action:none}
#badge{position:absolute;left:10px;top:8px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none}
#hint{position:absolute;right:10px;top:8px;font-size:11px;color:var(--mute);pointer-events:none}

/* slide strip */
#strip{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 0 6px}
.sactions{display:flex;gap:6px;padding:0 8px 6px}
.chip{height:30px;padding:0 11px;border-radius:15px;background:var(--panel-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;font-size:12px}
.chip:active{background:var(--panel-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[disabled]{opacity:.35;pointer-events:none}
.chip.danger{color:var(--danger)}
.chip.lbl{background:none;border-color:transparent;color:var(--mute);padding:0 4px 0 6px;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;padding:2px 10px 2px;align-items:flex-end}
.thumb{position:relative;flex:none;border-radius:6px;overflow:hidden;border:2px solid transparent;background:repeating-conic-gradient(#c3c7cf 0 25%,#eef0f4 0 50%) 0 0/10px 10px;cursor:pointer}
.thumb canvas{display:block}
.thumb.active{border-color:var(--accent)}
.thumb.dragover{border-color:var(--ok)}
.thumb i{position:absolute;left:2px;bottom:2px;font-style:normal;font-size:9px;line-height:1;background:rgba(0,0,0,.7);color:#fff;padding:2px 4px;border-radius:3px;font-variant-numeric:tabular-nums}
.addthumb{flex:none;width:38px;height:56px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mute)}

/* panel */
#panel{flex:none;background:var(--panel);border-top:1px solid var(--line);max-height:40vh;display:flex;flex-direction:column;min-height:0}
#panel[hidden]{display:none}
.ptop{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:none}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ink);border-color:var(--accent)}
.ptitle{padding:10px 13px;font-weight:600;white-space:nowrap}
.pbody{padding:10px 12px 12px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label,.lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.fld.grow{flex:1 1 150px}
.sl{display:flex;align-items:center;gap:8px}
.sl input[type=range]{flex:1;min-width:90px;height:28px;accent-color:var(--accent);margin:0}
.num{width:64px;height:32px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:0 6px;text-align:center;font-variant-numeric:tabular-nums}
.num.wide{width:84px}
textarea.txt{width:100%;min-height:62px;max-height:120px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
input.text{width:100%;height:36px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:32px;padding:0 12px;display:flex;align-items:center;gap:5px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button[disabled]{opacity:.35;pointer-events:none}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.swc.on{border-color:var(--ink)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.fonts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fonts::-webkit-scrollbar{display:none}
.fchip{flex:none;height:42px;min-width:84px;padding:0 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.1}
.fchip b{font-size:17px;font-weight:400}
.fchip small{font-size:9px;color:var(--mute);font-family:var(--ui)}
.fchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.gcell{aspect-ratio:1;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center}
.gcell:active{background:var(--panel-3)}
.gcell canvas{width:70%;height:70%}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{padding:8px 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);text-align:left;min-width:104px}
.preset b{display:block;font-size:12px}
.preset span{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.preset.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 2px}
.layer.on{border-color:var(--accent)}
.layer .nm{flex:1;min-width:0;text-align:left;padding:9px 6px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm span{overflow:hidden;text-overflow:ellipsis}
.layer .ib{width:34px;height:34px}
.layer.off .nm{opacity:.45}
.empty{color:var(--mute);padding:6px 2px}

/* toolbar */
#toolbar{flex:none;background:var(--panel);border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
#toolbar::-webkit-scrollbar{display:none}
.tool{flex:1 0 62px;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:10.5px;color:var(--mute)}
.tool:active{background:var(--panel-3)}
.tool.on{color:var(--accent)}

/* modal + toast */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:min(540px,100%);max-height:90%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.mbg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.sheet p{margin:0;color:var(--mute)}
.btn{height:42px;border-radius:12px;padding:0 16px;background:var(--panel-3);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.bar{height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.err{color:var(--err-ink);background:rgba(240,96,93,.12);border:1px solid rgba(240,96,93,.4);border-radius:10px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.okbox{background:rgba(52,195,143,.1);border:1px solid rgba(52,195,143,.35);border-radius:10px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute);max-height:130px;overflow:auto}
.list div{display:flex;justify-content:space-between;gap:10px}
.proj{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.proj .nm{flex:1;min-width:0}
.proj .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .nm span{font-size:11px;color:var(--mute)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);text-align:left;width:100%}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{display:block}
.opt span{color:var(--mute);font-size:12px}
.check{display:flex;align-items:center;gap:10px;min-height:34px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e9ecf2;color:#14161a;padding:10px 14px;border-radius:12px;font-weight:500;z-index:80;display:flex;gap:12px;align-items:center;max-width:min(92vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast[hidden]{display:none}
#toast button{color:#1d4ed8;font-weight:700}
input.text,select.text{width:100%;height:38px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:block;font-size:16px}.brand span{color:var(--mute);font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.rowlist{display:flex;flex-direction:column;gap:6px}
.tinyp{font-size:12px;color:var(--mute);margin:0}
.proj .nm{background:none;text-align:left}
.accs{display:flex;gap:10px;flex-wrap:wrap}.accs .swc{width:32px;height:32px}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 38%,#181b26 0%,#090a0e 72%);display:grid;place-items:center;transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.splash-in .lg{filter:drop-shadow(0 14px 44px rgba(226,176,79,.30))}
.word{font:600 15px var(--ui);letter-spacing:.55em;margin-right:-.55em;color:#ecd9a6;opacity:0;animation:lgFade .7s 1.2s ease forwards}
.tag{font:400 12px var(--ui);letter-spacing:.14em;color:#7c8294;opacity:0;animation:lgFade .7s 1.5s ease forwards}
.lg.anim .badge{transform-origin:60px 60px;animation:lgPop .8s cubic-bezier(.2,.9,.25,1.15) both}
.lg.anim .z{stroke-dasharray:100;stroke-dashoffset:100;animation:lgDraw .9s .45s cubic-bezier(.65,0,.25,1) forwards}
.lg.anim .cards rect{opacity:0;animation:lgCard .6s ease forwards}
.lg.anim .c3{animation-delay:.6s}.lg.anim .c2{animation-delay:.75s}.lg.anim .c1{animation-delay:.9s}
.lg.anim .shine{transform-origin:92px 27px;opacity:0;animation:lgShine .9s 1.25s ease both}
@keyframes lgPop{from{opacity:0;transform:scale(.72) rotate(-7deg)}to{opacity:1;transform:none}}
@keyframes lgDraw{to{stroke-dashoffset:0}}
@keyframes lgCard{from{opacity:0;transform:translateX(-10px)}to{opacity:var(--o,1);transform:none}}
@keyframes lgShine{0%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}100%{opacity:.9;transform:scale(1) rotate(90deg)}}
@keyframes lgFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.lg.anim *,.word,.tag{animation:none!important}.lg.anim .z{stroke-dashoffset:0}.lg.anim .cards rect{opacity:var(--o,1)}.word,.tag,.lg.anim .shine{opacity:1}}
</style>

<div id="app">
  <header class="top">
    <button class="ib" id="bProj" aria-label="Reopen a project"></button>
    <button class="title" id="bTitle" aria-label="Rename project"><b id="tName">Untitled carousel</b><span id="tMeta">1 slide</span></button>
    <button class="ib" id="bUndo" aria-label="Undo"></button>
    <button class="ib" id="bRedo" aria-label="Redo"></button>
    <button class="ib" id="bSet" aria-label="Settings"></button>
    <button class="pill" id="bExport" aria-label="Export"></button>
  </header>

  <main id="stage">
    <div id="canvasWrap"><canvas id="cv" aria-label="Design canvas"></canvas></div>
    <div id="badge"></div>
    <div id="hint">Swipe to change slide</div>
  </main>

  <section id="strip" aria-label="Slides">
    <div class="sactions scroll-x" id="sactions"></div>
    <div class="thumbs scroll-x" id="thumbs"></div>
  </section>

  <section id="panel" hidden></section>

  <nav id="toolbar" aria-label="Tools"></nav>
</div>
<div id="toast" hidden></div>
<div id="splash" aria-hidden="true"></div>
<div id="modals"></div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fBg" accept="image/*" hidden>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>
<input type="file" id="fProj" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
/* ============ utils ============ */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const deep = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const rad = d => d * Math.PI / 180;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let pending;
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') pending = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if (pending !== undefined) el.value = pending;
  return el;
}

/* ============ icons ============ */
const ICONS = {

    const img = new Image(); img.src = u;

    const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const cw = Math.max(1, Math.round(img.naturalWidth * k)), ch = Math.max(1, Math.round(img.naturalHeight * k));

  const m = modal('Project name', h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } }, inp, h('button', { type: 'button', class: 'btn primary block', onclick: ok }, 'Done')));
  setTimeout(() => { inp.focus(); inp.select(); }, 50);
}

/* ============ file inputs ============ */
$('#fImg').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  let n = 0;
  for (const f of files) {
    try { const id = await importImage(f); const o = newImage(id, ASSETS.get(id)); if (n) { o.x += n * 30; o.y += n * 30; } n++; addObject(o, 'Adjust'); }
    catch (err) { toast(err.message || 'Could not import that image'); }
  }
});
$('#fBg').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const id = await importImage(f); const bg = slide().bg; bg.img = id; bg.type = 'image'; bg.fit = 'cover'; commit(); render(); refreshThumbs(); S.panel = 'backdrop'; S.tab = 'Image'; buildPanel(); }
  catch (err) { toast(err.message || 'Could not import that image'); }
});
$('#fFont').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const nm = await importFont(f); LAYOUT.clear();
    let o = selObj(); if (!o || o.type !== 'text') { o = newText('Your font'); slide().objects.push(o); S.selId = o.id; S.panel = 'object'; }
    o.font = nm; S.tab = 'Font'; commit(); fitCanvas(); renderStrip(); buildPanel(); toast(`Font “${nm}” imported`);
  } catch { toast('That file is not a usable font. Try a .ttf, .otf or .woff file.'); }
});
$('#fProj').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { flushCommit(); const snap = serializeProject(); await loadProject(JSON.parse(await f.text())); await stashPrevious(snap); toast('Opened “' + P.name + '”'); document.querySelectorAll('.mbg').forEach(x => x.remove()); }
  catch (err) { toast(err.message && !/JSON/.test(err.message) ? err.message : 'That file could not be read as a Zon Studio project.'); }
});

/* ============ init ============ */
function init() {
  initNative(); applyTheme(); runSplash();
  $('#bProj').innerHTML = ic('folder', 21); $('#bUndo').innerHTML = ic('undo', 21); $('#bRedo').innerHTML = ic('redo', 21); $('#bSet').innerHTML = ic('sliders', 21);
  $('#bExport').innerHTML = ic('export', 17) + '<span>Export</span>';
  $('#bProj').onclick = openProjects; $('#bTitle').onclick = openRename; $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bSet').onclick = openSettings; $('#bExport').onclick = openExport;
  buildToolbar(); buildStripActions();
  new ResizeObserver(() => fitCanvas()).observe(stage);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { const vv = window.visualViewport, app = $('#app'); app.style.height = vv.height < window.innerHeight * 0.85 ? vv.height + 'px' : ''; });
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { LAYOUT.clear(); requestRender(); refreshThumbs(); });
  window.addEventListener('beforeunload', () => { try { flushCommit(); flushDraft(); } catch { /* ignore */ } });
  window.addEventListener('pagehide', () => { try { flushCommit(); flushDraft(); } catch { /* ignore */ } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { try { flushCommit(); flushDraft(); } catch { /* ignore */ } } });
  window.__zon = { project: () => P, state: S, assets: ASSETS, settings: SET };
  (async () => {
    let restored = false;
    if (SET.restore) { try { const d = await idb.get('draft'); if (d && d.slides && d.slides.length) { await loadProject(d); S.saved = false; syncHeader(); restored = true; } } catch { /* no draft */ } }
    if (!restored) { const [dw, dh] = String(SET.defSize).split('x').map(Number); if (dw > 0 && dh > 0) { P.w = dw; P.h = dh; } seedProject(); commit(); S.saved = false; fitCanvas(); renderStrip(); syncHeader(); }
    applyAmbient();
    document.documentElement.setAttribute('data-ready', '1');
  })();
}
init();
})();
</script>
